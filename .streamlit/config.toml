# Midnight Teal theme (extra styles in style.py)
[theme]
base = "dark"
primaryColor = "#2DD4BF"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#111B2E"
textColor = "#E5ECF6"
borderColor = "#1F2C44"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
baseRadius = "10px"
# success messages and inline code in the theme's teal (Streamlit's default is green)
greenColor = "#2DD4BF"
greenTextColor = "#5EEAD4"
greenBackgroundColor = "#0F2A30"
# info notes in a quiet slate (Streamlit's default is bright blue); links stay teal
blueColor = "#94A3B8"
blueTextColor = "#CBD5E1"
blueBackgroundColor = "#16233A"
linkColor = "#5EEAD4"
# chart colors: teal first, in an order checked for color-blind safety on this dark background
chartCategoricalColors = ["#11A797", "#d95926", "#3987e5", "#c98500", "#d55181", "#0ca30c", "#9085e9", "#e66767"]

[theme.sidebar]
backgroundColor = "#0E1726"
textColor = "#E5ECF6"
secondaryBackgroundColor = "#111B2E"
borderColor = "#1F2C44"
